[package]
name = "qwfwd"
version = "1.40.0"
edition = "2024"
license = "GPL-2.0-only"
description = "QuakeWorld server proxy"
repository = "https://github.com/QW-Group/qwfwd/"

[dependencies]
rand = "0.10"
# Pinned past 18.0.1: with an external printer, released versions process
# buffered keystrokes one per terminal event, so pasted or fast input stalls
# until the next key. Go back to a crates.io version once one ships the fix.
rustyline = { git = "https://github.com/kkawakam/rustyline.git", rev = "05eb9200f178989ad504718179f11890cfe362c9" }
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "sync", "time"] }

[target."cfg(target_os = \"linux\")".dependencies]
# A timerfd paces releases with better than millisecond precision (see src/timer.rs).
nix = { version = "0.31", features = ["time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.31", features = ["signal", "term"] }
