// This is the default QWFWD configuration file
// Feel free to change parameters to your liking

// Hostname shown to connecting clients in-game
set hostname QWFWD

// Domain (or ip) and port number
// set hostport "example.com:30000"

// Geographical info
// set countrycode "se"
// set city "Stockholm"
// set coords "59.3327,18.0656"

// UDP port on which QWFWD will listen for client, default port is 30000
// set net_port 30000

// IP address on which QWFWD will listen for client, default is all host IP addresses
// set net_ip X.X.X.X

// Developer mode, default is 0 (0=disabled, 1=enabled)
// set developer 0

// Quakeworld master servers help your QWFWD be found by users
set masters master.quakeworld.nu:27000 qwmaster.fodquake.net:27000 master.quakeservers.net:27000

// Notify master servers when QWFWD is up (0=disabled, 1=enabled)
set masters_heartbeat 1

// Query the master server list (0=disabled, 1=enabled)
set masters_query 1

// Specify a list of QW servers which are not allowed to be queried
set masters_filter_servers 127.0.0.1

// Connection smoothing: re-space client packets that arrive in clumps
// (e.g. over a cellular uplink) before forwarding them to the server.
// 0 = off, 1 = clients that use "setinfo smooth 1" (default),
// 2 = everyone except clients that use "setinfo smooth 0"
// set smooth 1

// Interval in ms between forwarded packets until the client's own send rate has
// been measured; the default is 1000/77, QuakeWorld's 77 packets per second
// set smooth_interval 12.987

// Slack in the queue is drained by shortening slots by at most this percent
// set smooth_drain 10

// Once queued packets are older than this many ms, drain at double rate
// set smooth_catchup 50

// Packets queued longer than this many ms are dropped, oldest first
// set smooth_maxdelay 200
