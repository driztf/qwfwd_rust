name: build targets
on: [pull_request]
jobs:
  test:
    if: github.repository == 'driztf/qwfwd_rust'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
  build:
    if: github.repository == 'driztf/qwfwd_rust'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            triple: x86_64-unknown-linux-gnu
          - target: linux-i686
            triple: i686-unknown-linux-gnu
          - target: linux-armhf
            triple: armv7-unknown-linux-gnueabihf
          - target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
          - target: windows-x64
            triple: x86_64-pc-windows-gnu
          - target: windows-x86
            triple: i686-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --target ${{ matrix.triple }}
